server:
  port: 8081
  tomcat:
    threads:
      max: 800         # Default is 200. Allows more simultaneous HTTP requests.
    accept-count: 1000 # Default is 100. Increases the waiting queue size.

spring:
  application:
    name: ride-matching-service

  datasource:
    url: jdbc:postgresql://localhost:5432/miniuber
    username: miniuber
    password: miniuber123
    hikari:
      maximum-pool-size: 50   # Default is 10. Allows more simultaneous DB writes.
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: ride-matching-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.miniuber.*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    com.miniuber: DEBUG
    org.springframework.kafka: INFO
    org.springframework.data.redis: INFO